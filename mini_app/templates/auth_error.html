<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docura.kz — Защищённый доступ</title>
<link rel="icon" href="{{ url_for('static', filename='branding/docura-favicon.ico') }}">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 40%, #EFF6FF 100%);
    color: #0F172A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: 0;
  }
  .card {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    box-shadow: 0 20px 48px -8px rgba(14, 165, 233, 0.16);
    max-width: 440px;
    width: 100%;
    padding: 36px 28px;
    text-align: center;
  }
  .lock-icon {
    width: 64px;
    height: 64px;
    background: #E0F2FE;
    color: #0284C7;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
  p { font-size: 14px; color: #64748B; line-height: 1.6; margin-bottom: 24px; }
  .btn {
    display: inline-block;
    width: 100%;
    box-sizing: border-box;
    background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
    transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="card">
  <div class="lock-icon">🔒</div>
  <h1>Доступ защищён</h1>
  <p>{{ error or "Срок действия ссылки для входа истёк или токен недействителен. Чтобы войти в кабинет, откройте Telegram-бота @docurakz_bot и нажмите «💻 Личный кабинет»." }}</p>
  <a href="https://t.me/docurakz_bot" class="btn">Открыть Telegram-бота</a>
</div>
</body>
</html>
